name: Add a project
description: Suggest a relevant self-hosted media server, backend, bridge, plugin, or media-automation system.
title: "Add: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping expand Awesome Debrid Media. Inclusion is based on relevance and evidence, not endorsement.

        Please classify conservatively:
        - `not found` is not the same as `not supported`;
        - generic Debrid support is not proof of AIOStreams support;
        - generic Stremio-addon support is not automatically explicit AIOStreams support;
        - source-only tvOS is not a public Apple TV release;
        - separate Riven implementations must be verified independently and must not inherit facts from one another.

        Unknown / not found is a valid answer. Do not guess.

  - type: input
    id: project
    attributes:
      label: Project name
      placeholder: Example Project
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Canonical repository
      description: Prefer the canonical upstream repository.
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Best-fit architecture
      options:
        - Full media server
        - Streaming backend
        - Jellyfin-compatible server
        - Bridge
        - Media automation / VFS
        - Media-server plugin
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: relevance
    attributes:
      label: Why does it belong in scope?
      description: Briefly explain the server-side role and how it fits the Debrid/Usenet media ecosystem.
    validations:
      required: true

  - type: dropdown
    id: aiostreams
    attributes:
      label: AIOStreams relationship
      description: Choose conservatively. Unknown / not found is valid.
      options:
        - Explicit AIOStreams integration
        - Generic Stremio-addon integration
        - Plugin / bridge integration
        - Unknown / not found
        - No first-party support with evidence
        - Documented scope conflict
    validations:
      required: true

  - type: input
    id: aiostreams_evidence
    attributes:
      label: AIOStreams evidence URL, if claimed
      description: If you selected an integration/support state, link the strongest first-party source. Leave blank for unknown / not found.
      placeholder: https://github.com/owner/repo/blob/main/...
    validations:
      required: false

  - type: textarea
    id: capabilities
    attributes:
      label: Debrid / Usenet relationship
      description: Note any claimed Debrid or Usenet path and the relevant provider/protocol context. Unknown / not found is acceptable.
      placeholder: |
        Debrid: ...
        Usenet: ...
    validations:
      required: false

  - type: dropdown
    id: apple_tv
    attributes:
      label: Apple TV path
      description: Distinguish an installable release from source code only. Unknown / not found is valid.
      options:
        - Unknown / not found
        - First-party installable release
        - First-party source only
        - Compatible third-party client
        - No Apple TV path with evidence
    validations:
      required: true

  - type: input
    id: apple_tv_evidence
    attributes:
      label: Apple TV evidence URL, if claimed
      placeholder: https://github.com/owner/repo/...
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: First-party evidence / research links
      description: Link official docs, source code, README, issues/PRs/releases, or direct maintainer statements. State what each source establishes. If a claim remains unknown, say what first-party material you checked instead of converting absence into a negative claim.
      placeholder: |
        - Official README: https://github.com/owner/repo/blob/main/README.md — documents ...
        - Source code: https://github.com/owner/repo/blob/main/path/to/source — implements ...
    validations:
      required: true

  - type: textarea
    id: uncertainty
    attributes:
      label: Known uncertainty or conflicts
      description: Record anything ambiguous, contradictory, version-specific, or not yet verified.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I understand that submitted classifications are evidence leads and will be independently reviewed before curated data changes.
          required: true
        - label: I have not treated “not found” as proof of “not supported.”
          required: true

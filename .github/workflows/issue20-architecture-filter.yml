name: Issue 20 architecture filter

on:
  push:
    branches:
      - work/issue-20-architecture-filter

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-20-architecture-filter

      - name: Apply Issue 20 patch
        run: python3 scripts/issue20_architecture_filter_patch.py

      - name: Validate
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          test -s dist/index.html
          grep -q 'data-architecture="' dist/index.html
          grep -q 'Architecture: all' dist/index.html
          grep -q 'Full media server' dist/index.html
          grep -q 'Streaming backend' dist/index.html
          grep -q 'Jellyfin-compatible server' dist/index.html
          grep -q 'Bridge' dist/index.html
          grep -q 'Automation / VFS' dist/index.html
          grep -q 'Media-server plugin' dist/index.html
          grep -q 'data-label="Other"' dist/index.html

      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Add architecture filtering"
          git push origin HEAD:work/issue-20-architecture-filter

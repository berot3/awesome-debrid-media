name: Issue 32 shareable state patch

on:
  push:
    branches:
      - work/issue-32-shareable-filter-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-32-shareable-filter-state

      - name: Apply Issue 32 patch
        run: python3 scripts/issue32_shareable_state_patch.py

      - name: Validate and build
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          test -s dist/index.html
          grep -q 'id="copy-share-link"' dist/index.html
          grep -q 'new URLSearchParams(window.location.search)' dist/index.html
          grep -q "params.append('arch', control.value)" dist/index.html
          grep -q "window.history.replaceState" dist/index.html
          grep -q "window.addEventListener('popstate'" dist/index.html

      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Make comparison state shareable"
          git push origin HEAD:work/issue-32-shareable-filter-state

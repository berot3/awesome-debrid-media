name: Issue 36 evidence link test

on:
  push:
    branches:
      - work/issue-36-evidence-link-health

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-36-evidence-link-health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate implementation
        run: |
          python3 -m py_compile scripts/check_evidence_links.py
          python3 scripts/validate.py
          python3 scripts/build.py
          python3 scripts/check_evidence_links.py --timeout 8 --retries 0 --workers 8 | tee evidence-link-report.txt

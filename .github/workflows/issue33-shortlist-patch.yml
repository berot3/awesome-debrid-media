name: Issue 33 shortlist patch

on:
  push:
    branches:
      - work/issue-33-focused-shortlist

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-33-focused-shortlist

      - name: Apply Issue 33 patch
        run: python3 scripts/issue33_shortlist_patch.py

      - name: Validate and build
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          grep -q 'Selected project comparison' dist/index.html
          grep -q 'data-select-project=' dist/index.html
          grep -q 'maximum 4' dist/index.html
          grep -q 'shortlistLimit = 4' dist/index.html
          grep -q 'clone.classList.remove' dist/index.html
          grep -q 'selectedProjects.size < shortlistLimit' dist/index.html
          grep -q 'shortlistOpen.disabled = shortlistFocused || size < 2' dist/index.html
          grep -q 'Backend model' dist/index.html

      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Add focused project shortlist"
          git push origin HEAD:work/issue-33-focused-shortlist

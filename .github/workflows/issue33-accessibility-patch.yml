name: Issue 33 accessibility patch

on:
  push:
    branches:
      - work/issue-33-focused-shortlist

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-33-focused-shortlist

      - name: Apply accessibility patch
        run: python3 scripts/issue33_accessibility_patch.py

      - name: Validate and build
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          grep -q 'aria-label="Add MediaStorm to comparison"' dist/index.html
          grep -q 'Remove ${projectName} from comparison' dist/index.html
          grep -q 'shortlistToolbar.focus()' dist/index.html
          grep -q 'nextRemove.focus()' dist/index.html
          grep -q 'search.focus()' dist/index.html

      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Preserve shortlist keyboard focus"
          git push origin HEAD:work/issue-33-focused-shortlist

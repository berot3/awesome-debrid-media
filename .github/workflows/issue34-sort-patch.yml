name: Issue 34 sort patch

on:
  push:
    branches:
      - work/issue-34-neutral-sorting

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-34-neutral-sorting
      - name: Apply Issue 34 patch
        run: python3 scripts/issue34_sort_patch.py
      - name: Validate and build
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          test -s dist/index.html
          grep -q 'id="sort-filter"' dist/index.html
          grep -q 'Sort: curated order' dist/index.html
          grep -q 'params.set('\''sort'\''' dist/index.html
          grep -q 'applySort();' dist/index.html
          grep -q 'data-architecture-label=' dist/index.html
          grep -q 'data-verified=' dist/index.html
      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Add neutral project sorting"
          git push origin HEAD:work/issue-34-neutral-sorting

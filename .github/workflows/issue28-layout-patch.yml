name: Issue 28 intermediate filter layout

on:
  push:
    branches:
      - work/issue-28-intermediate-filter-layout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-28-intermediate-filter-layout

      - name: Apply Issue 28 patch
        run: python3 scripts/issue28_filter_layout_patch.py

      - name: Validate
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          test -s dist/index.html
          grep -q 'grid-template-columns: 1fr; align-items: stretch' dist/index.html

      - name: Commit implementation
        run: |
          if git diff --quiet -- scripts/build.py; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.py
          git commit -m "Fix intermediate filter layout"
          git push origin HEAD:work/issue-28-intermediate-filter-layout

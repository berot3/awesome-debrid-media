name: Issue 3 project coverage patch

on:
  push:
    branches:
      - work/issue-3-project-coverage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out coverage branch
        uses: actions/checkout@v4
        with:
          ref: work/issue-3-project-coverage

      - name: Apply accepted project records
        run: python3 scripts/issue3_project_coverage_patch.py

      - name: Validate curated data
        run: python3 scripts/validate.py

      - name: Build static site
        run: python3 scripts/build.py

      - name: Commit project coverage
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Expand project coverage"
          git push origin HEAD:work/issue-3-project-coverage
